services:
  spitbot:
    build: .
    container_name: spitbot
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3003"
      WWEBJS_AUTH_PATH: /app/.wwebjs_auth
      DATA_PATH: /app/data
    volumes:
      - ./wwebjs_auth:/app/.wwebjs_auth
      - ./data:/app/data
    ports:
      - "3003:3003"
